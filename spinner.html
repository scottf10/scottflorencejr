<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Spin the Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }

        #wheelCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .pointer {
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 40px solid #ef4444; /* Red pointer */
            z-index: 10;
            filter: drop-shadow(-2px 2px 4px rgba(0,0,0,0.2));
        }

        .modal-enter {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col p-4 md:p-8">

    <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col md:flex-row gap-8 items-start">
        
        <!-- Left Column: Controls -->
        <div class="w-full md:w-1/3 bg-white p-6 rounded-2xl shadow-lg border border-green-100 flex flex-col gap-6 h-fit">
            
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-bold text-green-700 mb-2">Student Picker</h1>
                <p class="text-gray-500 text-sm">Paste names below, one per line.</p>
            </div>

            <!-- Names Input -->
            <div class="flex-1 min-h-[250px]">
                <textarea 
                    id="namesInput" 
                    class="w-full h-full min-h-[250px] p-4 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors resize-y text-lg"
                    placeholder="Alice&#10;Bob&#10;Charlie&#10;David&#10;Eve"
                ></textarea>
            </div>

            <!-- Controls -->
            <div class="space-y-4 bg-green-50 p-4 rounded-xl">
                <div>
                    <div class="flex justify-between mb-1">
                        <label for="spinTime" class="text-sm font-semibold text-gray-700">Spin Duration</label>
                        <span id="spinTimeDisplay" class="text-sm font-bold text-green-600">3s</span>
                    </div>
                    <input 
                        type="range" 
                        id="spinTime" 
                        min="1" 
                        max="10" 
                        value="3" 
                        step="0.5"
                        class="w-full h-2 bg-green-200 rounded-lg appearance-none cursor-pointer accent-green-600"
                    >
                </div>
            </div>
            
            <div class="flex gap-2">
                <button 
                    id="updateWheelBtn" 
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition-transform active:scale-95 shadow-md"
                >
                    Update Wheel
                </button>
                <button 
                    id="resetBtn" 
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl transition-colors shadow-sm"
                    title="Clear list"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <button 
                    id="soundToggleBtn" 
                    class="bg-blue-100 hover:bg-blue-200 text-blue-600 font-bold py-3 px-4 rounded-xl transition-colors shadow-sm"
                    title="Toggle Sound"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="soundIcon">
                        <!-- Default: Sound On Icon -->
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707A.996.996 0 0015 19V5a.996.996 0 00-1.707-.707L9.586 10H7a2 2 0 00-2 2z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Right Column: Wheel -->
        <div class="w-full md:w-2/3 flex flex-col items-center justify-center relative">
            <div class="relative w-full max-w-md aspect-square mb-8">
                <!-- Pointer -->
                <div class="pointer hidden md:block" style="right: -10px;"></div>
                <div class="pointer md:hidden block" style="top: -10px; right: 50%; transform: translateX(50%) rotate(90deg);"></div>
                
                <!-- Canvas -->
                <canvas id="wheelCanvas" width="600" height="600" class="w-full h-full bg-white"></canvas>
                
                <!-- Center Peg -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full border-4 border-gray-200 shadow-inner z-10 flex items-center justify-center">
                     <div class="w-4 h-4 bg-gray-400 rounded-full shadow-inner"></div>
                </div>
            </div>

            <button 
                id="spinBtn" 
                class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-2xl font-bold py-4 px-12 rounded-full transition-transform transform hover:scale-105 active:scale-95 shadow-[0_6px_0_#b45309] hover:shadow-[0_4px_0_#b45309] active:shadow-none active:translate-y-[6px]"
            >
                SPIN!
            </button>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl modal-enter relative overflow-hidden">
            <!-- Confetti Canvas -->
            <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none w-full h-full"></canvas>
            
            <div class="relative z-10">
                <h2 class="text-2xl font-bold text-gray-500 mb-2 uppercase tracking-wider">Winner!</h2>
                <p id="winnerText" class="text-5xl font-bold text-green-600 mb-8 break-words"></p>
                
                <div class="space-y-3">
                    <button id="removeWinnerBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md">
                        Remove from Wheel
                    </button>
                    <button id="keepWinnerBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl transition-colors">
                        Keep on Wheel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let names = [];
        let colors = [];
        
        // --- DOM Elements ---
        const namesInput = document.getElementById('namesInput');
        const updateWheelBtn = document.getElementById('updateWheelBtn');
        const resetBtn = document.getElementById('resetBtn');
        const spinTimeInput = document.getElementById('spinTime');
        const spinTimeDisplay = document.getElementById('spinTimeDisplay');
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerText = document.getElementById('winnerText');
        const removeWinnerBtn = document.getElementById('removeWinnerBtn');
        const keepWinnerBtn = document.getElementById('keepWinnerBtn');

        // --- Wheel Variables ---
        let currentRotation = 0; // Current angle in radians
        let isSpinning = false;
        let animationId;
        let selectedName = "";
        let selectedIndex = -1;
        let lastTickIndex = -1;

        // --- Audio Variables ---
        let soundEnabled = true;
        let audioInitialized = false;
        let tickSynth;
        let winSynth;

        const soundOnPath = "M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707A.996.996 0 0015 19V5a.996.996 0 00-1.707-.707L9.586 10H7a2 2 0 00-2 2z";
        const soundOffPath = "M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2";

        // Pleasant color palette
        const palette = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FDCB6E', '#6C5CE7',
            '#FF8ED4', '#A8E6CF', '#FD79A8', '#55EFEC', '#FF9F43',
            '#1B9CFC', '#F8EFBA', '#58B19F', '#EAB543', '#82589F'
        ];

        // --- Initialization ---
        // Load default names if empty
        if (!namesInput.value.trim()) {
            namesInput.value = "Alice\nBob\nCharlie\nDavid\nEve\nFrank\nGrace";
        }
        
        // --- Event Listeners ---
        spinTimeInput.addEventListener('input', (e) => {
            spinTimeDisplay.textContent = `${e.target.value}s`;
        });

        updateWheelBtn.addEventListener('click', updateWheelFromInput);
        
        resetBtn.addEventListener('click', () => {
            namesInput.value = '';
            names = [];
            drawWheel();
        });

        spinBtn.addEventListener('click', startSpin);

        removeWinnerBtn.addEventListener('click', () => {
            if (selectedIndex > -1) {
                names.splice(selectedIndex, 1);
                colors.splice(selectedIndex, 1);
                // Update textarea to reflect removal
                namesInput.value = names.join('\n');
                drawWheel();
            }
            closeModal();
        });

        keepWinnerBtn.addEventListener('click', closeModal);
        
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        
        soundToggleBtn.addEventListener('click', async () => {
            if (!audioInitialized) await initAudio();
            soundEnabled = !soundEnabled;
            soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${soundEnabled ? soundOnPath : soundOffPath}" />`;
            if (soundEnabled) {
                soundToggleBtn.classList.remove('bg-gray-200', 'text-gray-500');
                soundToggleBtn.classList.add('bg-blue-100', 'text-blue-600');
            } else {
                soundToggleBtn.classList.remove('bg-blue-100', 'text-blue-600');
                soundToggleBtn.classList.add('bg-gray-200', 'text-gray-500');
            }
        });

        // Initial setup
        updateWheelFromInput();

        // --- Functions ---

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            // Fast decay synth for the wheel "tick"
            tickSynth = new Tone.Synth({
                oscillator: { type: "square" },
                envelope: { attack: 0.005, decay: 0.05, sustain: 0.0, release: 0.01 }
            }).toDestination();
            tickSynth.volume.value = -12; // Lower volume

            // Brighter poly synth for the winner chord
            winSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 1.5 }
            }).toDestination();
            winSynth.volume.value = -8;

            audioInitialized = true;
        }
        
        // Shuffle array to randomize colors
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateWheelFromInput() {
            if (isSpinning) return;
            
            const rawNames = namesInput.value.split('\n');
            // Clean up names (trim whitespace, remove empty lines)
            names = rawNames.map(n => n.trim()).filter(n => n.length > 0);
            
            // Assign colors
            colors = [];
            let colorIndex = 0;
            const shuffledPalette = [...palette];
            shuffleArray(shuffledPalette);
            
            for (let i = 0; i < names.length; i++) {
                // Try not to have identical adjacent colors if we wrap around
                if (i === names.length - 1 && names.length > 1 && shuffledPalette[colorIndex % shuffledPalette.length] === colors[0]) {
                     colors.push(shuffledPalette[(colorIndex + 1) % shuffledPalette.length]);
                } else {
                     colors.push(shuffledPalette[colorIndex % shuffledPalette.length]);
                }
                colorIndex++;
            }
            
            // Reset rotation so it looks nice on update
            currentRotation = 0;
            drawWheel();
        }

        function drawWheel() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10; // Padding

            if (names.length === 0) {
                // Draw empty placeholder
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f3f4f6';
                ctx.fill();
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#9ca3af';
                ctx.font = '30px Fredoka, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Add names to spin!', centerX, centerY);
                return;
            }

            const arc = (2 * Math.PI) / names.length;

            for (let i = 0; i < names.length; i++) {
                const angle = currentRotation + i * arc;
                
                // Draw slice
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                
                // Slice border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2); // Rotate to middle of slice
                
                ctx.fillStyle = '#ffffff';
                
                // Adjust font size based on number of slices
                let fontSize = 32;
                if (names.length > 20) fontSize = 16;
                else if (names.length > 10) fontSize = 24;
                
                ctx.font = `600 ${fontSize}px Fredoka, sans-serif`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                
                // Shadow for better readability
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                // Max text width to fit in slice
                const maxTextWidth = radius * 0.7;
                
                // Truncate text if it's too long
                let displayText = names[i];
                if (ctx.measureText(displayText).width > maxTextWidth) {
                     while(ctx.measureText(displayText + '...').width > maxTextWidth && displayText.length > 0) {
                         displayText = displayText.slice(0, -1);
                     }
                     displayText += '...';
                }

                ctx.fillText(displayText, radius - 20, 0);
                ctx.restore();
            }
            
            // Draw outer border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        async function startSpin() {
            if (isSpinning || names.length === 0) return;
            
            if (soundEnabled && !audioInitialized) {
                await initAudio(); // Start audio context on user interaction
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 1. Equal Probability Selection: Pick a winner uniformly at random (1/N probability for each student)
            selectedIndex = Math.floor(Math.random() * names.length);
            
            const spinDurationSec = parseFloat(spinTimeInput.value);
            const durationMs = spinDurationSec * 1000;
            const arc = (2 * Math.PI) / names.length;
            
            // Pointer angle relative to canvas (Desktop = 0 / 3 o'clock, Mobile = -PI/2 / 12 o'clock)
            const pointerAngle = window.innerWidth < 768 ? -Math.PI / 2 : 0;
            
            // Add a slight natural jitter within 80% of the slice center to land nicely inside the winning segment
            const sliceJitter = (Math.random() - 0.5) * (arc * 0.8);
            
            // Calculate the angle within the wheel for the winning slice
            const winningSliceCenter = (selectedIndex + 0.5) * arc + sliceJitter;
            
            // Target rotation so the winning slice lands right under the pointer
            const targetRotation = pointerAngle - winningSliceCenter;
            
            // Ensure minimum full revolutions
            const minSpins = Math.max(3, Math.floor(spinDurationSec));
            const extraSpins = minSpins * Math.PI * 2;
            
            // Calculate total angular distance to travel clockwise
            let deltaRotation = (targetRotation - currentRotation) % (Math.PI * 2);
            if (deltaRotation < 0) deltaRotation += Math.PI * 2;
            
            const totalRotation = deltaRotation + extraSpins;
            const startRotation = currentRotation;
            const startTime = performance.now();
            
            lastTickIndex = getCurrentSliceIndex(startRotation);

            // Easing function: easeOutQuart (starts fast, slows down smoothly)
            function easeOutQuart(x) {
                return 1 - Math.pow(1 - x, 4);
            }

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                const easedProgress = easeOutQuart(progress);

                currentRotation = (startRotation + totalRotation * easedProgress) % (Math.PI * 2);

                drawWheel();

                // Trigger Tick Sound
                if (soundEnabled && audioInitialized) {
                    const currentSlice = getCurrentSliceIndex(currentRotation);
                    if (currentSlice !== lastTickIndex && lastTickIndex !== -1) {
                         const velocity = Math.max(0.1, 1 - progress); 
                         tickSynth.triggerAttackRelease("C6", "32n", Tone.now(), velocity);
                    }
                    lastTickIndex = currentSlice;
                }

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    finishSpin();
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function getCurrentSliceIndex(rotation) {
            if (names.length === 0) return -1;
            const pointerAngle = window.innerWidth < 768 ? -Math.PI / 2 : 0;
            const arc = (2 * Math.PI) / names.length;
            
            // Angle difference between pointer position and current wheel rotation
            let diff = (pointerAngle - rotation) % (2 * Math.PI);
            if (diff < 0) diff += 2 * Math.PI;
            
            return Math.floor(diff / arc) % names.length;
        }

        function finishSpin() {
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            selectedIndex = getCurrentSliceIndex(currentRotation);
            selectedName = names[selectedIndex];
            
            if (soundEnabled && audioInitialized) {
                const now = Tone.now();
                winSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "1n", now); // Happy chord
            }
            
            showModal(selectedName);
        }

        // --- Modal & Confetti ---
        function showModal(winner) {
            winnerText.textContent = winner;
            winnerModal.classList.remove('hidden');
            winnerModal.classList.add('flex');
            fireConfetti();
        }

        function closeModal() {
            winnerModal.classList.add('hidden');
            winnerModal.classList.remove('flex');
            stopConfetti();
        }

        // Simple Confetti Implementation
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettis = [];
        let confettiAnimationId;
        
        function resizeConfettiCanvas() {
            // Match canvas to modal content box roughly
            const modalContent = winnerModal.querySelector('.bg-white');
            confettiCanvas.width = modalContent.offsetWidth;
            confettiCanvas.height = modalContent.offsetHeight;
        }

        window.addEventListener('resize', () => {
            if (!winnerModal.classList.contains('hidden')) {
                resizeConfettiCanvas();
            }
            // Redraw wheel on resize to handle pointer position changes between mobile/desktop
            if(!isSpinning) drawWheel();
        });

        function fireConfetti() {
            resizeConfettiCanvas();
            confettis = [];
            for (let i = 0; i < 100; i++) {
                confettis.push({
                    x: confettiCanvas.width / 2,
                    y: confettiCanvas.height / 2 + 50, // Start slightly below center
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 5 + 5,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 1) * 15,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    rot: Math.random() * 360,
                    dRot: (Math.random() - 0.5) * 10
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let activeConfetti = false;
            
            for (let i = 0; i < confettis.length; i++) {
                let p = confettis[i];
                p.y += p.dy;
                p.x += p.dx;
                p.dy += 0.5; // Gravity
                p.rot += p.dRot;
                
                if (p.y < confettiCanvas.height) {
                    activeConfetti = true;
                    cCtx.save();
                    cCtx.translate(p.x, p.y);
                    cCtx.rotate(p.rot * Math.PI / 180);
                    cCtx.fillStyle = p.color;
                    cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    cCtx.restore();
                }
            }
            
            if (activeConfetti) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            }
        }

        function stopConfetti() {
            cancelAnimationFrame(confettiAnimationId);
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

    </script>
</body>
</html>
